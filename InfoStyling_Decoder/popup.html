<!doctype html>
<html><head><meta charset="utf-8"><title>InfoStyling Decoder</title>
<style>
:root{color-scheme:light dark;--bg:#ffffff;--fg:#17191e;--muted:#5b6270;--line:#e1e4ea;--card:#f5f6f8;--accent:#1f5fe0;--accentFg:#ffffff;--accentBg:#e9f0ff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1e23;--fg:#e9ebf0;--muted:#a3a9b5;--line:#343943;--card:#262a31;--accent:#7aa2ff;--accentFg:#0e1530;--accentBg:#22304f}}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:14px 16px 14px}
h1{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:750;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
h1::before{content:"";width:28px;height:28px;flex:none;background:url(icons/icon32.png) center/contain no-repeat;border-radius:6px}
h2{font-size:11px;font-weight:700;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
label{display:flex;align-items:center;gap:8px;margin:0;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
label:last-of-type{border-bottom:none}
.settings{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
input[type=number]{width:72px;margin-left:auto;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
li:hover{border-color:var(--accent);background:var(--accentBg)}
li b{display:block;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
li span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li.empty{color:var(--muted);cursor:default;text-align:center;border-style:dashed;background:transparent}
li.empty:hover{border-color:var(--line);background:transparent}
#decodeFile{width:100%;font:inherit;font-weight:700;padding:10px;border-radius:10px;border:none;background:var(--accent);color:var(--accentFg);cursor:pointer}
#decodeFile:hover{filter:brightness(1.08)}
#decodeFile:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{color:var(--muted);font-size:12px;margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
p b{color:var(--fg)}
</style></head>
<body><main>
<h1>InfoStyling Decoder</h1>
<button id="decodeFile">Decode an image file…</button>
<h2>On this page</h2>
<ul id="found"><li class="empty">No hidden messages found yet.</li></ul>
<h2>Settings</h2>
<div class="settings">
<label><input type="checkbox" id="autoScan"> Auto-scan images on pages</label>
<label>Minimum image size <input type="number" id="minSize" min="32" max="4000" step="16"> px</label>
<label><input type="checkbox" id="deepAuto"> Deep robust scan when auto-scanning (slow)</label>
</div>
<p>Or right-click any image and choose <b>Decode InfoStyling</b>. For files on your Mac, use <b>Decode an image file</b>.</p>
</main><script src="popup.js"></script></body></html>
