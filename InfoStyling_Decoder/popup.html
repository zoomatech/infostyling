<!doctype html>
<html><head><meta charset="utf-8"><title>InfoStyling Decoder</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1b1d22;--muted:#5b6270;--line:#d9dde4;--card:#f6f7f9;--accent:#1f4fd1}
@media (prefers-color-scheme:dark){:root{--bg:#1f2227;--fg:#e7e9ee;--muted:#a3a9b5;--line:#3a3f48;--card:#2a2e35;--accent:#8fb0ff}}
body{margin:0;width:320px;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:12px 14px}h1{font-size:14px;margin:0 0 8px}h2{font-size:12px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label{display:flex;align-items:center;gap:8px;margin:6px 0}
input[type=number]{width:70px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
li{background:var(--card);border-radius:8px;padding:6px 8px;cursor:pointer}
li:hover{outline:2px solid var(--accent)}
li b{display:block;font-size:11px;color:var(--accent)}
li span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted)}
#decodeFile{width:100%;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;margin-bottom:4px}
p{color:var(--muted);font-size:12px;margin:10px 0 0;border-top:1px solid var(--line);padding-top:8px}
</style></head>
<body><main>
<h1>InfoStyling Decoder</h1>
<button id="decodeFile">Decode an image file…</button>
<h2>On this page</h2>
<ul id="found"><li class="empty">No hidden messages found yet.</li></ul>
<h2>Settings</h2>
<label><input type="checkbox" id="autoScan"> Auto-scan images on pages</label>
<label>Minimum image size <input type="number" id="minSize" min="32" max="4000" step="16"> px</label>
<label><input type="checkbox" id="deepAuto"> Deep robust scan when auto-scanning (slow)</label>
<p>Or right-click any image and choose <b>Decode InfoStyling</b>. For files on your Mac, use <b>Decode an image file</b>.</p>
</main><script src="popup.js"></script></body></html>
