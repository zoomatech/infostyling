<!doctype html>
<html><head><meta charset="utf-8"><title>InfoStyling Decoder: decode a file</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f8;--panel:#ffffff;--fg:#17191e;--muted:#5b6270;--line:#dfe3ea;--card:#f6f7f9;--accent:#1f5fe0;--accentFg:#fff;--accentBg:#eef3ff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--panel:#1f2227;--fg:#e9ebf0;--muted:#a3a9b5;--line:#363b45;--card:#272b32;--accent:#7aa2ff;--accentFg:#0e1530;--accentBg:#1f2a44;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:32px auto;padding:28px 28px 24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
@media (max-width:800px){main{margin:0;border-radius:0;border-left:none;border-right:none;padding:20px 16px}}
h1{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:750;margin:0 0 6px}
h1::before{content:"";width:36px;height:36px;flex:none;background:url(icons/icon48.png) center/contain no-repeat;border-radius:8px}
.sub{color:var(--muted);margin:0 0 20px}
#drop{border:2px dashed var(--line);border-radius:14px;padding:44px 16px;text-align:center;background:var(--card);cursor:pointer;font-size:15px;transition:border-color .15s,background .15s}
#drop:hover,#drop:focus-visible{border-color:var(--accent);outline:none}
#drop.over{border-color:var(--accent);background:var(--accentBg)}
#drop b{display:inline-block;margin-bottom:6px;padding:8px 18px;border-radius:999px;background:var(--accent);color:var(--accentFg)}
#drop small{display:block;margin-top:8px;color:var(--muted)}
label{display:flex;align-items:center;gap:8px;margin:14px 0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
#status{margin:20px 0 4px;font-weight:700;font-size:16px}#status.err{color:var(--err)}
#meta{color:var(--muted);font-size:12px}
#out{margin-top:12px}
#text{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:60vh;overflow:auto}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
#copy{background:var(--accent);border-color:var(--accent);color:var(--accentFg)}
[hidden]{display:none!important}
</style></head>
<body><main>
<h1>Decode an image file</h1>
<p class="sub">Use this for images saved on your computer. Chrome does not let extensions read local file:// pages, so pick or drop the file here instead.</p>
<div id="drop" tabindex="0"><b>Choose an image</b> or drag one here<br><small>PNG, JPEG, WebP, GIF, BMP</small></div>
<input type="file" id="file" accept="image/*" hidden>
<label><input type="checkbox" id="deep" checked> Deep robust scan (slower, finds more Robust messages)</label>
<div id="status" hidden></div><div id="meta"></div>
<div id="out" hidden><div id="text"></div><div class="row"><button id="copy">Copy</button><button id="save">Save .txt</button></div></div>
</main>
<script src="lib/infostyling-core.js"></script>
<script src="decode.js"></script>
</body></html>
